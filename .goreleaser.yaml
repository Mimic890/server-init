# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: server-init

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/server-init
    binary: server-init
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    goamd64: [v1]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    # no version in the name: install.sh can use releases/latest/download/
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
