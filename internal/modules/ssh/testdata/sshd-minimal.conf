# Managed by server-init - re-run server-init instead of editing by hand.
# Loaded first (00-) because sshd uses the FIRST value it sees for most options.

Port 40022

# Authentication: keys only
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
HostbasedAuthentication no
PermitUserEnvironment no
PermitRootLogin prohibit-password

# Brute-force limits
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60

# Forwarding
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no

# Logging
LogLevel VERBOSE

# Modern cryptography only (ed25519 keys)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
